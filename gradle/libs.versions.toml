[versions]
agp = "8.7.0"

# AndroidX
room = "2.5.2"
constraintlayout = "2.1.4"
appcompat = "1.6.1"
material = "1.9.0"
preference = "1.2.0"
multidex = "2.0.1"
camerax = "1.3.0-beta01"

# Third-party
volley = "1.2.1"
gson = "2.9.0"
guava = "31.0.1-android"
rxandroid = "2.1.1"
zip4j = "2.10.0"
mididriver = "v1.21"
pngj = "2.2.3"
mobile-ffmpeg = "v4.3.2-compact"
filepicker = "4.3.0"
ambilwarna = "2.0.1"
acra = "5.9.3"
kotlinBom = "1.8.0"
autoService = "1.0"
asm = "9.8"

# Testing
junit = "4.13.2"
androidxJunit = "1.1.5"
androidxTestRunner = "1.5.2"

[libraries]
# AndroidX
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-rxjava2 = { module = "androidx.room:room-rxjava2", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

# Third-party
volley = { module = "com.android.volley:volley", version.ref = "volley" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
mididriver = { module = "com.github.billthefarmer:mididriver", version.ref = "mididriver" }
pngj = { module = "com.github.nikita36078:pngj", version.ref = "pngj" }
mobile-ffmpeg = { module = "com.github.nikita36078:mobile-ffmpeg", version.ref = "mobile-ffmpeg" }
filepicker = { module = "com.github.nikita36078:filepicker", version.ref = "filepicker" }
ambilwarna = { module = "com.github.yukuku:ambilwarna", version.ref = "ambilwarna" }
acra-dialog = { module = "ch.acra:acra-dialog", version.ref = "acra" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlinBom" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoService" }
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "autoService" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
