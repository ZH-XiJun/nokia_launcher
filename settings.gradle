pluginManagement {
    repositories {
        // JitPack 必须排最前：com.github.* 只有 jitpack.io 能构建，国内镜像不含这些构件
        maven { url "https://jitpack.io" }
        // 国内镜像加速（处理 google/mavenCentral 的常规依赖）
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        google()
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // JitPack 必须排最前：com.github.* 只有 jitpack.io 能构建，国内镜像不含这些构件
        maven { url "https://jitpack.io" }
        // 国内镜像加速（处理 google/mavenCentral 的常规依赖）
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        google()
        mavenCentral()
        mavenLocal()
    }
}
rootProject.name = "J2ME Loader"
include ':app', ':dexlib'
